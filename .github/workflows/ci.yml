name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint, Vet & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux systray deps
        run: sudo apt-get update && sudo apt-get install -y libayatana-appindicator3-dev
      - name: Reject committed node_modules
        shell: bash
        run: |
          if git ls-files | grep -E "(^|/)node_modules/"; then
            echo "node_modules must not be committed" >&2
            exit 1
          fi
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.11.4
      - name: Vet
        run: go vet ./...
      - name: Build (linux/amd64)
        run: go build ./cmd/harness
      - name: Build (windows/amd64)
        env:
          GOOS: windows
          GOARCH: amd64
        run: go build ./cmd/harness

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux systray deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libayatana-appindicator3-dev
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Test
        run: go test ./...
