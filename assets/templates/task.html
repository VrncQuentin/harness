{{define "title"}}Task{{end}}
{{define "content"}}
<section>
  <div class="section-head">
    <h1>Task</h1>
    <p class="section-desc">Enter a prompt. The harness loops: sends it to the model, executes any tool calls the model requests, and feeds results back until the model finishes or the loop limit is reached.</p>
  </div>

  {{if .Error}}
  <div class="alert alert-err"><p>{{.Error}}</p></div>
  {{end}}

  <div class="chat" id="task-container">
    <div class="chat-transcript" id="task-transcript"></div>

    <form id="task-form" class="chat-input-form" autocomplete="off">
      <textarea id="task-input" class="chat-input" rows="3" placeholder="Ask the harness to do something... (e.g. read file.txt and summarize it)" required></textarea>
      <div class="chat-input-actions">
        <button type="submit" class="btn" id="task-send">Send</button>
        <button type="button" class="btn btn-ghost" id="task-stop" style="display:none">Stop</button>
        <button type="button" class="btn btn-danger btn-sm" id="task-clear">Clear</button>
      </div>
    </form>
  </div>
</section>

<script>
(function(){
  const form = document.getElementById('task-form');
  const input = document.getElementById('task-input');
  const transcript = document.getElementById('task-transcript');
  const sendBtn = document.getElementById('task-send');
  const stopBtn = document.getElementById('task-stop');
  const clearBtn = document.getElementById('task-clear');
  let controller = null;
  let messages = [];
  let sessionId = '';

  function pushMsg(type, data) {
    const el = document.createElement('div');
    el.className = 'chat-msg';
    switch (type) {
      case 'user':
        el.classList.add('is-user');
        el.innerHTML = '<span class="chat-role">You</span><div class="chat-body">' + esc(data) + '</div>';
        break;
      case 'text':
        el.classList.add('is-assistant');
        el.innerHTML = '<span class="chat-role">Assistant</span><div class="chat-body">' + esc(data) + '</div>';
        break;
      case 'tool_call':
        el.classList.add('is-tool');
        el.innerHTML = '<span class="chat-role">Tool call</span><div class="chat-body"><code>' + esc(data.tool_id) + '</code><pre class="tool-args">' + esc(data.tool_args || '') + '</pre></div>';
        break;
      case 'tool_result':
        el.classList.add('is-tool-result');
        let body = data.tool_error ? '<div class="tool-error">ERROR: ' + esc(data.tool_error) + '</div>' : '';
        if (data.tool_result) body += '<pre class="tool-content">' + esc(data.tool_result) + '</pre>';
        el.innerHTML = '<span class="chat-role">Result</span><div class="chat-body"><code>' + esc(data.tool_id) + '</code>' + body + '</div>';
        break;
      case 'done':
        el.classList.add('is-system');
        el.innerHTML = '<span class="chat-role">Done</span><div class="chat-body">Task completed in ' + data.turn + ' turn(s).</div>';
        break;
      case 'limit':
        el.classList.add('is-system', 'is-warn');
        el.innerHTML = '<span class="chat-role">Limit</span><div class="chat-body">' + esc(data.content) + '</div>';
        break;
      case 'doom_loop':
        el.classList.add('is-system', 'is-err');
        el.innerHTML = '<span class="chat-role">Loop detected</span><div class="chat-body">' + esc(data.content) + '</div>';
        break;
      case 'error':
        el.classList.add('is-system', 'is-err');
        el.innerHTML = '<span class="chat-role">Error</span><div class="chat-body">' + esc(data.content) + '</div>';
        break;
      case 'cancelled':
        el.classList.add('is-system', 'is-warn');
        el.innerHTML = '<span class="chat-role">Cancelled</span><div class="chat-body">Task was stopped.</div>';
        break;
    }
    transcript.appendChild(el);
    transcript.scrollTop = transcript.scrollHeight;
  }

  function esc(s) {
    if (!s) return '';
    const el = document.createElement('span');
    el.textContent = s;
    return el.innerHTML;
  }

  function setRunning(v) {
    sendBtn.style.display = v ? 'none' : '';
    stopBtn.style.display = v ? '' : 'none';
    input.disabled = v;
  }

  form.addEventListener('submit', async function(e) {
    e.preventDefault();
    const text = input.value.trim();
    if (!text) return;
    input.value = '';
    messages.push({role: 'user', content: text});
    pushMsg('user', text);

    setRunning(true);
    controller = new AbortController();
    try {
      const resp = await fetch('/task/stream', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({agent: '', session_id: sessionId, messages: messages}),
        signal: controller.signal,
      });
      if (!resp.ok) { pushMsg('error', {content: 'Request failed: ' + resp.status}); return; }
      const reader = resp.body.getReader();
      const decoder = new TextDecoder();
      let buf = '';
      while (true) {
        const {done, value} = await reader.read();
        if (done) break;
        buf += decoder.decode(value, {stream: true});
        const parts = buf.split('\n\n');
        buf = parts.pop();
        for (const part of parts) {
          if (!part.trim()) continue;
          try {
            const frame = JSON.parse(part);
            if (frame.event === 'session') {
              sessionId = frame.data.session_id;
              continue;
            }
            if (frame.data && frame.data.error) {
              pushMsg('error', {content: frame.data.error});
              continue;
            }
            if (frame.data) pushMsg(frame.event, frame.data);
            if (frame.data && frame.data.terminate) {
              setRunning(false);
              controller = null;
              return;
            }
          } catch (_) {}
        }
      }
    } catch (err) {
      if (err.name !== 'AbortError') pushMsg('error', {content: err.message});
    }
    setRunning(false);
    controller = null;
  });

  stopBtn.addEventListener('click', function() {
    if (controller) controller.abort();
  });

  clearBtn.addEventListener('click', function() {
    transcript.innerHTML = '';
    messages = [];
    sessionId = '';
  });
})();
</script>
{{end}}
