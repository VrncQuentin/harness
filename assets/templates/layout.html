{{define "layout"}}<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Harness - {{template "title" .}}</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<header class="topbar">
  <div class="wrap">
    <div class="brand">
      <span class="brand-mark"></span>
      <span class="brand-name">Harness</span>
    </div>
    <nav class="nav">
      <a href="/" class="nav-link {{if eq .Page "status"}}active{{end}}">Status</a>
      <a href="/agents" class="nav-link {{if eq .Page "agents"}}active{{end}}">Agents</a>
      <a href="/memory" class="nav-link {{if eq .Page "memory"}}active{{end}}">Memory</a>
      <a href="/config" class="nav-link {{if eq .Page "config"}}active{{end}}">Config</a>
    </nav>
  </div>
</header>

<main class="wrap main">
{{template "content" .}}
</main>

<footer class="footer">
  <div class="wrap">
    <span>Local AI inference harness</span>
    <span class="mono">uptime <span id="uptime">{{.UptimeText}}</span></span>
  </div>
</footer>

<script src="/static/app.js"></script>
</body>
</html>{{end}}
