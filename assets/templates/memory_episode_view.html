{{define "title"}}Episode - {{.Name}}{{end}}
{{define "content"}}
<h1 class="page-title">Episode</h1>

<section class="grid">
  <div class="card">
    <header class="card-head">
      <h3>{{.Name}}</h3>
      <span class="logs-meta mono">
        {{if .HasScore}}score {{printf "%.3f" .Score}}{{end}}
        {{if .Indexed}}<span class="badge badge-ok">indexed</span>{{end}}
        ~{{.Tokens}} tok
      </span>
    </header>
    <p class="card-meta">Agent: <code>{{.Agent}}</code></p>
    <p class="card-meta"><code>{{.Path}}</code></p>
    <p class="card-meta"><a href="/memory/episodes?agent={{.Agent}}{{if .Query}}&q={{.Query}}{{end}}">&larr; Back to episodes</a></p>

    <pre class="tree-content">{{.Content}}</pre>

    <div class="card-actions" style="margin-top:1em">
      <form method="post" action="/memory/promote" style="display:inline">
        <input type="hidden" name="text" value="{{.Content}}">
        <button type="submit" class="btn btn-sm">Promote to Global Fact</button>
      </form>
      <form method="post" action="/memory/note" style="display:inline">
        <input type="hidden" name="agent" value="{{.Agent}}">
        <input type="hidden" name="text" value="{{.Content}}">
        <button type="submit" class="btn btn-sm btn-ghost">Append to Agent Note</button>
      </form>
    </div>
  </div>
</section>
{{end}}
