{{define "title"}}Edit {{.Path}}{{end}}
{{define "content"}}
<h1 class="page-title">Edit memory</h1>

<section class="grid">
  <div class="card">
    <header class="card-head">
      <h3>{{.Path}}</h3>
      <span class="logs-meta mono">{{if .IsNew}}new file{{else}}~{{.Tokens}} tok{{end}}</span>
    </header>
    <p class="card-meta">{{.Desc}}</p>

    {{if .SaveErr}}
    <div class="alert alert-warn">
      <div class="alert-head">
        <p class="alert-sub">{{.SaveErr}}</p>
      </div>
    </div>
    {{end}}

    <form method="post" action="/memory/save" class="cfg-form">
      <input type="hidden" name="path" value="{{.Path}}">
      <div class="fg">
        <label for="content">Content (markdown)</label>
        <textarea id="content" name="content" class="mem-edit" rows="22" spellcheck="false">{{.Content}}</textarea>
      </div>
      <div class="cfg-actions">
        <button type="submit" class="btn btn-primary">Save</button>
        <a href="/memory" class="btn btn-ghost">Cancel</a>
      </div>
    </form>
  </div>
</section>
{{end}}
